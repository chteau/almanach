# United States (federal only) — tax year 2026.
# Figures from IRS Rev. Proc. 2025-32 (2026 inflation adjustments, including the 2025 One Big Beautiful Bill Act),
# Form 1040-ES (2026) and the Internal Revenue Code. State taxes are not covered.
year: 2026
# 26 USC 7503: a deadline on a Saturday, Sunday or legal holiday moves to the next business day.
shift: next_business_day
shiftSource: https://www.law.cornell.edu/uscode/text/26/7503
