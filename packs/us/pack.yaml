        fr: "Impôts fédéraux uniquement : impôts d'État et locaux non estimés. Déclaration célibataire ou commune ; chef de famille et époux séparés non gérés.",
        en: "Federal taxes only: state and local taxes are not estimated. Single or married filing jointly; head of household and married filing separately are not handled.",
        de: "Nur Bundessteuern: bundesstaatliche und lokale Steuern werden nicht geschätzt. Ledig oder gemeinsame Veranlagung; Haushaltsvorstand und getrennte Veranlagung werden nicht unterstützt.",
      }
