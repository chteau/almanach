    label: { fr: EIN, en: EIN, de: EIN }
    pattern: "^\\d{2}-?\\d{7}$"
    example: "12-3456789"
    required: false
invoice:
  vatRateBp: 0
  defaultMode: none
  requiredIdentifiers: []
  requireClientAddress: false
  mentions: {}
