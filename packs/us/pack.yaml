country: US
maturity: experimental
# Maturity per function (verified = sourced and covered by tests); a function not listed is unavailable.
# No revenue threshold is published for the United States. Activities: one Schedule C per business, SE tax and
# income tax once on the total.
features:
  estimates: experimental
  deadlines: experimental
  activities: experimental
  # Reserve: experimental — state taxes not modelled; revenue without expenses.
  reserve: experimental
  # Prepared declaration: experimental — safe harbor and annualized method sourced from Pub. 505 (2026), but
  # married filing separately limit, state taxes and expenses are not handled.
  prepare: experimental
  # Expenses: experimental — lower the Schedule C profit of the SE tax and income tax estimates; allowability and
  # Schedule C lines not checked.
  expenses: experimental
  # Vault kinds: experimental — usual documents, no legal validity period is claimed.
  vault_types: experimental
# Packs using fields added in Almanach 0.1.0 (reserve, fr_income_tax, prepare, expenses, vault).
minAppVersion: "0.1.0"
vault:
  kinds:
    - id: ein_letter
      label:
        {
          fr: "Lettre de confirmation de l'EIN (CP 575)",
          en: "EIN confirmation letter (CP 575)",
          de: "EIN-Bestätigungsschreiben (CP 575)",
        }
    - id: w9_copy
      label:
        {
          fr: "Copie du formulaire W-9 remis aux clients",
          en: "Copy of the W-9 given to clients",
          de: "Kopie des an Kunden übergebenen W-9",
        }
    - id: business_license
      label:
        {
          fr: "Licence commerciale (ville ou État)",
          en: "Business license (city or state)",
          de: "Gewerbelizenz (Stadt oder Bundesstaat)",
        }
      expires: true
      remindDays: [60, 30]
    - id: insurance_certificate
      label: { fr: "Certificat d'assurance", en: "Certificate of insurance", de: "Versicherungsnachweis" }
      expires: true
      remindDays: [30, 7]
expensesNote:
  {
    fr: "Les dépenses saisies réduisent le bénéfice (Schedule C) des estimations de self-employment tax et d'impôt sur le revenu. Almanach ne vérifie pas qu'elles sont déductibles.",
    en: "Recorded expenses lower the profit (Schedule C) of the self-employment tax and income tax estimates. Almanach does not check that they are deductible.",
    de: "Erfasste Ausgaben mindern den Gewinn (Schedule C) der Schätzungen von Self-Employment Tax und Einkommensteuer. Almanach prüft nicht, ob sie abzugsfähig sind.",
  }
name: { fr: États-Unis, en: United States, de: Vereinigte Staaten }
currency: USD
fiscalYearStart: "01-01"
bank: us
statuses:
  - id: sole_proprietor
    label:
      {
        fr: Entreprise individuelle (sole proprietor),
        en: Sole proprietor,
        de: Einzelunternehmer (sole proprietor),
      }
  - id: single_member_llc
    label: { fr: LLC à associé unique, en: Single-member LLC, de: Einpersonen-LLC }
declarationPeriods: [quarterly]
options:
  - id: married_joint
    label:
      {
        fr: "Déclaration commune (married filing jointly)",
        en: Married filing jointly,
        de: "Gemeinsame Veranlagung (married filing jointly)",
      }
identifiers:
  - id: ein
    label: { fr: EIN, en: EIN, de: EIN }
    pattern: "^\\d{2}-?\\d{7}$"
    example: "12-3456789"
    required: false
invoice:
  vatRateBp: 0
  defaultMode: none
  requiredIdentifiers: []
  requireClientAddress: false
  mentions: {}
