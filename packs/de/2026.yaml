# Rücklage: geschätzte Einkommensteuer und Solidaritätszuschlag des laufenden Jahres auf den Gewinn (Umsatz minus
# erfasste Ausgaben), für eine Einzelperson ohne Sonderausgaben: eher zu hoch als zu niedrig. Die Vorauszahlungen
# des Jahres (§ 37 EStG, mit Solidaritätszuschlag) mindern sie. Nicht berücksichtigt und in der Warnung genannt:
# Kirchensteuer (Land und Konfession), Gewerbesteuer (Hebesatz der Gemeinde, teilweise auf die Einkommensteuer
# angerechnet, § 35 EStG, https://www.gesetze-im-internet.de/estg/__35.html), Kranken- und Pflegeversicherung,
# geschuldete Umsatzsteuer. Die Marge von 10 % ist eine Produktentscheidung, kein gesetzlicher Wert.
reserve:
  include: [income_tax, solidarity_surcharge]
  settles:
    - { deadline: est_vorauszahlung, fiscalYear: current }
    - { deadline: annual_returns, fiscalYear: previous }
    - { deadline: annual_returns_kleinunternehmer, fiscalYear: previous }
  marginBp: 1000
  warning:
    fr: "Estimation indicative de l'impôt sur le revenu et du Solidaritätszuschlag d'une personne seule, calculée sur le chiffre d'affaires moins les dépenses saisies, sans dépenses spéciales (assurances) ni autres revenus. Non compris : impôt d'Église (selon le Land et la confession), Gewerbesteuer (selon le taux de la commune, en partie imputée sur l'impôt sur le revenu), assurance maladie et dépendance, TVA due : ajoutez-les en supplément personnel. Ne remplace pas un avis du Finanzamt."
    en: "Indicative income tax and solidarity surcharge estimate for a single person, based on revenue less recorded expenses, without special expenses (insurance) or other income. Not included: church tax (depends on the state and denomination), trade tax (depends on the municipality's rate, partly credited against income tax), health and care insurance, VAT due: add them as a personal extra. Not a notice from the tax office."
    de: "Unverbindliche Schätzung von Einkommensteuer und Solidaritätszuschlag für eine Einzelperson, auf Basis des Umsatzes abzüglich erfasster Ausgaben, ohne Sonderausgaben (Versicherungen) und andere Einkünfte. Nicht enthalten: Kirchensteuer (je nach Land und Konfession), Gewerbesteuer (je nach Hebesatz der Gemeinde, teilweise auf die Einkommensteuer angerechnet), Kranken- und Pflegeversicherung, geschuldete Umsatzsteuer: als persönlichen Zuschlag ergänzen. Kein Bescheid des Finanzamts."
  source: https://www.gesetze-im-internet.de/estg/__32a.html
  verified_on: "2026-11-26"
