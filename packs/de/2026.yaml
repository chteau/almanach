        en: "2026 annual returns (income tax, VAT)",
        de: "Jahressteuererklärungen 2026 (ESt, USt)",
      }
    description:
      fr: "Dépôt sans conseiller fiscal des déclarations d'impôt sur le revenu (avec EÜR) et de TVA pour 2026 : sept mois après la fin de l'année. Activité commerciale : le cas échéant aussi la déclaration de Gewerbesteuer (§ 14a GewStG)."
      en: "Filing of the 2026 income tax return (with EÜR profit statement) and VAT return without a tax advisor: seven months after year end. Trade: where required, also the trade tax return (§ 14a GewStG)."
      de: "Abgabe der Einkommensteuer- (mit EÜR) und Umsatzsteuererklärung 2026 ohne Steuerberater: sieben Monate nach Jahresende. Gewerbebetrieb: gegebenenfalls auch die Gewerbesteuererklärung (§ 14a GewStG)."
    appliesTo: { withoutOptions: [kleinunternehmer] }
