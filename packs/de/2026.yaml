    schedule:
      type: dates
      dates:
        - { due: "2026-05-10", periodStart: "2026-01-01", periodEnd: "2026-03-31" }
        - { due: "2026-08-10", periodStart: "2026-04-01", periodEnd: "2026-06-30" }
        - { due: "2026-11-10", periodStart: "2026-07-01", periodEnd: "2026-09-30" }
        - { due: "2027-02-10", periodStart: "2026-10-01", periodEnd: "2026-12-31" }
    declaresRevenue: true
    prepare: *ust_va_prepare
    link: https://www.elster.de
    source: https://www.gesetze-im-internet.de/ustdv_1980/__46.html
    verified_on: "2026-11-26"
