        - { due: "2026-04-10", periodStart: "2026-01-01", periodEnd: "2026-03-31" }
        - { due: "2026-07-10", periodStart: "2026-04-01", periodEnd: "2026-06-30" }
        - { due: "2026-10-10", periodStart: "2026-07-01", periodEnd: "2026-09-30" }
        - { due: "2027-01-10", periodStart: "2026-10-01", periodEnd: "2026-12-31" }
    declaresRevenue: true
    prepare: *ust_va_prepare
    link: https://www.elster.de
    source: https://www.gesetze-im-internet.de/ustg_1980/__18.html
    verified_on: "2026-11-26"
  - id: ust_voranmeldung_quarterly_extended
    kind: tax
    label:
      {
        fr: "Déclaration de TVA trimestrielle (USt-VA, délai prolongé)",
        en: "Quarterly VAT return (USt-VA, extended deadline)",
        de: "Umsatzsteuer-Voranmeldung (vierteljährlich, Dauerfristverlängerung)",
      }
    description:
      fr: "Déclarer et payer la TVA du trimestre via ELSTER le 10 du deuxième mois suivant (Dauerfristverlängerung, sans Sondervorauszahlung)."
      en: "File and pay the quarter's VAT through ELSTER by the 10th of the second month after it (Dauerfristverlängerung, no Sondervorauszahlung)."
      de: "Umsatzsteuer des Quartals bis zum 10. des übernächsten Monats über ELSTER anmelden und zahlen (Dauerfristverlängerung, ohne Sondervorauszahlung)."
    appliesTo:
