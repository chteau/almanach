# United Kingdom — tax year 2025-26 (6 April 2025 to 5 April 2026).
# Checked on gov.uk on the date given in verified_on. Only the obligations still falling due are listed;
# figures for estimates start with 2026.yaml.
year: 2025
shift: none
shiftSource: https://www.gov.uk/pay-self-assessment-tax-bill
holidaysSource: https://www.gov.uk/bank-holidays
holidays: []
deadlines:
  - id: self_assessment_registration
    kind: tax
    label:
      {
        fr: "Inscription au Self Assessment",
        en: Register for Self Assessment,
        de: Anmeldung zum Self Assessment,
      }
    description:
      fr: "Si vous avez commencé à travailler à votre compte pendant l'année fiscale 2025-26 et gagné plus de 1 000 £, inscrivez-vous auprès de HMRC pour recevoir votre UTR."
      en: "If you started working for yourself in the 2025-26 tax year and earned more than £1,000, register with HMRC to get your UTR."
      de: "Wenn Sie im Steuerjahr 2025-26 selbstständig geworden sind und mehr als 1.000 £ verdient haben, melden Sie sich bei HMRC an, um Ihre UTR zu erhalten."
    appliesTo: { options: [sa_not_registered] }
    schedule:
      { type: dates, dates: [{ due: "2026-10-05", periodStart: "2025-04-06", periodEnd: "2026-04-05" }] }
    link: https://www.gov.uk/register-for-self-assessment
    source: https://www.gov.uk/register-for-self-assessment
    verified_on: "2026-11-26"
  - id: payment_on_account_2
    kind: tax
    label:
      { fr: "Second acompte (payment on account)", en: Second payment on account, de: Zweite Vorauszahlung }
    description:
      fr: "Second acompte de l'impôt 2025-26."
      en: "Second advance payment towards your 2025-26 tax bill."
      de: "Zweite Vorauszahlung auf die Steuer 2025-26."
    schedule: { type: dates, dates: [{ due: "2026-07-31" }] }
    link: https://www.gov.uk/understand-self-assessment-bill/payments-on-account
    source: https://www.gov.uk/understand-self-assessment-bill/payments-on-account
    verified_on: "2026-11-26"
  - id: self_assessment_paper
    kind: tax
    label:
      {
        fr: "Déclaration Self Assessment papier",
        en: Paper Self Assessment return,
        de: Self-Assessment-Erklärung auf Papier,
      }
    description:
      fr: "Date limite de dépôt de la déclaration papier pour l'année fiscale 2025-26."
      en: "Deadline for the 2025-26 paper tax return."
      de: "Frist für die Papiererklärung des Steuerjahres 2025-26."
    schedule:
      { type: dates, dates: [{ due: "2026-10-31", periodStart: "2025-04-06", periodEnd: "2026-04-05" }] }
    link: https://www.gov.uk/self-assessment-tax-returns/deadlines
    source: https://www.gov.uk/self-assessment-tax-returns/deadlines
    verified_on: "2026-11-26"
  - id: self_assessment_online
    kind: tax
    label:
      {
        fr: "Déclaration en ligne et solde",
        en: Online return and balancing payment,
        de: Online-Erklärung und Restzahlung,
      }
    description:
      fr: "Déclaration en ligne de l'année fiscale 2025-26, paiement du solde et du premier acompte de 2026-27. Le 31 janvier 2027 est un dimanche : sauf par Faster Payments ou carte, le paiement doit parvenir à HMRC le vendredi 29 janvier."
      en: "Online tax return for 2025-26, balancing payment and first payment on account for 2026-27. 31 January 2027 is a Sunday: except by Faster Payments or card, the payment must reach HMRC by Friday 29 January."
      de: "Online-Erklärung für 2025-26, Restzahlung und erste Vorauszahlung für 2026-27. Der 31. Januar 2027 ist ein Sonntag: Außer per Faster Payments oder Karte muss die Zahlung HMRC bis Freitag, 29. Januar, erreichen."
    schedule:
      { type: dates, dates: [{ due: "2027-01-31", periodStart: "2025-04-06", periodEnd: "2026-04-05" }] }
    declaresRevenue: true
    # Self-employment (short) page 2025-26 (SA103S 2026, HMRC 12/25), for turnover below £90,000: box 9 turnover
    # (received, cash basis), box 20 total allowable expenses (a total alone is accepted below £90,000), or box 10.1
    # trading income allowance instead of any expense. Weekend rule: https://www.gov.uk/pay-self-assessment-tax-bill.
    prepare:
      basis: collected
      span: period
      lines:
        - id: turnover
          label:
            {
              fr: "Case 9 — Chiffre d'affaires (turnover)",
              en: "Box 9 — Turnover",
              de: "Feld 9 — Umsatz (turnover)",
            }
          measure: revenue
        - id: expenses
          label:
            {
              fr: "Case 20 — Total des dépenses admissibles",
              en: "Box 20 — Total allowable expenses",
              de: "Feld 20 — Abzugsfähige Ausgaben gesamt",
            }
          measure: expenses
      note:
        fr: "Chiffres de la page Self-employment (short) 2025-26 (SA103S), réservée à un chiffre d'affaires annuel sous 90 000 £. Si vous demandez la trading allowance (case 10.1, jusqu'à 1 000 £), laissez les cases 11 à 20 vides. Assujetti à la TVA : recettes et dépenses sont hors TVA, déclarez-les ainsi."
        en: "Figures for the 2025-26 Self-employment (short) page (SA103S), for annual turnover below £90,000. If you claim the trading allowance (box 10.1, up to £1,000), leave boxes 11 to 20 empty. VAT registered: turnover and expenses are without VAT; enter them that way."
        de: "Zahlen für die Seite Self-employment (short) 2025-26 (SA103S), für einen Jahresumsatz unter 90.000 £. Wenn Sie den Trading Allowance (Feld 10.1, bis 1.000 £) beanspruchen, lassen Sie die Felder 11 bis 20 leer. Umsatzsteuerregistriert: Einnahmen und Ausgaben sind ohne Umsatzsteuer; melden Sie sie so."
      source: https://www.gov.uk/government/publications/self-assessment-self-employment-short-sa103s
      verified_on: "2026-11-26"
    link: https://www.gov.uk/self-assessment-tax-returns/deadlines
    source: https://www.gov.uk/self-assessment-tax-returns/deadlines
    verified_on: "2026-11-26"
