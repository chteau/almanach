# Pack France — metadata used by onboarding. Yearly rules live in <year>.yaml.
country: FR
maturity: verified
# Maturity per function (verified = sourced and covered by tests); a function not listed is unavailable.
features:
  thresholds: verified
  estimates: verified
  deadlines: verified
  # Mixed activity (BNC, BIC services, BIC sales): ceilings on the total, rates per activity (rules.test.ts).
  activities: verified
  # Reserve: experimental — the income tax scale for 2026 income will be set by the 2027 finance law, not adopted on
  # 2026-11-26 (rejected by the Assemblée nationale on 4 November, under examination in the Senate:
  # https://www.senat.fr/travaux-parlementaires/textes-legislatifs/la-loi-en-clair/projet-de-loi-de-finances-pour-2027.html);
  # the latest published scale (2025 income, F1419 checked 2026-11-26) is used instead. Only this business and the
  # parts are known of the household. Contributions, flat-rate tax and CFP parts are sourced (2026.yaml).
  reserve: experimental
  # Prepared declaration: one declaration, revenue split "en autant de lignes que vous exercez d'activités", boxes
  # named as on the Urssaf FAQ (Cipav box apart), 0 when nothing collected (autoentrepreneur.urssaf.fr FAQ, checked
  # 2026-11-26); rules.prepare.test.ts.
  prepare: verified
  # Expenses: shown for information only — the micro regime deducts a flat-rate allowance, never actual expenses
  # (F23267, Urssaf "Déterminer mon chiffre d'affaires", checked 2026-11-26); rules.prepare.test.ts.
  expenses: verified
  # Vault kinds: each kind cites the official page describing the document; no legal validity period is claimed
  # (expiry dates are entered from the document itself, reminder days are a product choice); rules.test.ts.
  vault_types: verified
  # Factur-X EN16931: every sample passes veraPDF (PDF/A-3B) and the CEN EN 16931 CII Schematron (docs/einvoicing.md).
  einvoicing: verified
# Packs using fields added in Almanach 0.1.0 (reserve, fr_income_tax, prepare, expenses, vault).
minAppVersion: "0.1.0"
vault:
  kinds:
    - id: rc_pro
      label:
        {
          fr: "Attestation d'assurance RC professionnelle",
          en: "Professional liability insurance certificate",
          de: "Berufshaftpflicht-Versicherungsnachweis",
        }
      expires: true
      remindDays: [30, 7]
      # Compulsory for regulated activities and some trades only (F23668).
      source: https://entreprendre.service-public.gouv.fr/vosdroits/F23668
      verified_on: "2026-11-26"
    - id: sirene_situation
      label:
        {
          fr: "Avis de situation au répertoire SIRENE",
          en: "SIRENE registration notice (Insee)",
          de: "SIRENE-Eintragungsbescheinigung (Insee)",
        }
      source: https://entreprendre.service-public.gouv.fr/vosdroits/R17969
      verified_on: "2026-11-26"
    # An individual business gets an extrait K (Kbis is for companies) or the free RNE proof of registration (F21000).
    - id: registration_extract
      label:
        {
          fr: "Justificatif d'immatriculation au RNE ou extrait K",
          en: "Proof of registration in the RNE or K extract",
          de: "RNE-Eintragungsnachweis oder K-Auszug",
        }
      source: https://entreprendre.service-public.gouv.fr/vosdroits/F21000
      verified_on: "2026-11-26"
    - id: domiciliation
      label: { fr: "Contrat de domiciliation", en: "Business address contract", de: "Domizilierungsvertrag" }
      expires: true
      remindDays: [60, 30]
      # Contract with an approved domiciliation company, 3 months minimum (F2160).
      source: https://entreprendre.service-public.gouv.fr/vosdroits/F2160
      verified_on: "2026-11-26"
    - id: urssaf_vigilance
      label:
        {
          fr: "Attestation de vigilance Urssaf",
          en: "Urssaf compliance certificate (attestation de vigilance)",
          de: "Urssaf-Unbedenklichkeitsbescheinigung",
        }
      expires: true
      remindDays: [30, 7]
      # Printable from the auto-entrepreneur online account (FAQ); valid 6 months, asked by clients for contracts of
      # 5 000 € excl. VAT or more (F31422, art. L243-15 CSS and L8222-1 Code du travail).
      source: https://www.autoentrepreneur.urssaf.fr/portail/accueil/une-question/questions-frequentes.html
      verified_on: "2026-11-26"
# Expenses note: no actual expense is deductible from revenue, the flat-rate allowance (34 %, 50 %, 71 %) stands for
# them — https://entreprendre.service-public.gouv.fr/vosdroits/F23267 ("ce ne sont donc pas les charges réelles qui
# sont déduites") and https://www.autoentrepreneur.urssaf.fr/portail/accueil/une-question/toutes-les-fiches-pratiques/determiner-mon-chiffre-daffaires.html
# ("Aucune charge ou dépense n'est donc déductible"), both verified_on 2026-11-26. The schema has no source field for
# this note.
expensesNote:
  {
    fr: "En micro-entreprise, les dépenses réelles ne sont pas déductibles : l'abattement forfaitaire s'applique à leur place. Elles sont affichées ici à titre indicatif et ne changent aucun calcul.",
    en: "In a micro-entreprise, actual expenses are not deductible: the flat-rate allowance applies instead. They are shown here for information and change no computation.",
    de: "In der Micro-Entreprise sind tatsächliche Ausgaben nicht abzugsfähig: Stattdessen gilt der Pauschalabzug. Sie werden hier nur zur Information angezeigt und ändern keine Berechnung.",
  }
name: { fr: France, en: France, de: Frankreich }
currency: EUR
fiscalYearStart: "01-01"
bank: iban
statuses:
  - id: micro_bnc
    label:
      {
        fr: "Micro-entrepreneur — libéral (BNC)",
        en: "Micro-entrepreneur — liberal profession (BNC)",
        de: "Kleinstunternehmer — freier Beruf (BNC)",
      }
    hint:
      {
        fr: "Développement, conseil, design, formation…",
        en: "Software, consulting, design, training…",
        de: "Softwareentwicklung, Beratung, Design, Schulung…",
      }
  - id: micro_bic_services
    label:
      {
        fr: "Micro-entrepreneur — prestations de services (BIC)",
        en: "Micro-entrepreneur — commercial services (BIC)",
        de: "Kleinstunternehmer — gewerbliche Dienstleistungen (BIC)",
      }
  - id: micro_bic_sales
    label:
      {
        fr: "Micro-entrepreneur — vente de marchandises (BIC)",
        en: "Micro-entrepreneur — sale of goods (BIC)",
        de: "Kleinstunternehmer — Warenverkauf (BIC)",
      }
declarationPeriods: [monthly, quarterly]
options:
  - id: versement_liberatoire
    label:
      {
        fr: "Versement libératoire de l'impôt sur le revenu",
        en: "Flat-rate income tax payment (versement libératoire)",
        de: "Pauschale Einkommensteuer (versement libératoire)",
      }
  - id: vat_liable
    label:
      {
        fr: "Assujetti à la TVA (franchise en base dépassée ou option)",
        en: "VAT liable (threshold exceeded or opted in)",
        de: "Umsatzsteuerpflichtig (Schwelle überschritten oder Option)",
      }
  - id: cipav
    label:
      {
        fr: "Affilié à la Cipav (profession libérale réglementée)",
        en: "Member of the Cipav pension fund (regulated profession)",
        de: "Mitglied der Cipav (reglementierter freier Beruf)",
      }
  - id: artisan
    label:
      {
        fr: "Activité artisanale (inscrite au registre des métiers)",
        en: "Craft business (trades register)",
        de: "Handwerksbetrieb (Handwerksregister)",
      }
  - id: acre
    label:
      {
        fr: "ACRE (aide à la création d'entreprise)",
        en: "ACRE (start-up contribution relief)",
        de: "ACRE (Gründungsentlastung)",
      }
identifiers:
  - id: siret
    label: { fr: SIRET, en: SIRET, de: SIRET }
    pattern: "^\\d{14}$"
    example: "732 829 320 00074"
    required: true
    checksum: luhn
  - id: vat
    label: { fr: "N° de TVA intracommunautaire", en: "EU VAT number", de: "USt-IdNr." }
    pattern: "^FR[0-9A-Z]{2}\\d{9}$"
    example: "FR40732829320"
    required: false
invoice:
  vatRateBp: 2000
  defaultMode: franchise
  toggle: { option: vat_liable, mode: standard }
  requiredIdentifiers: [siret]
  requireClientAddress: true
  # Art. R526-27 du Code de commerce : « EI » ou « entrepreneur individuel » à côté du nom.
  sellerNameMention: EI
  mentions:
    franchise:
      fr: "TVA non applicable, art. 293 B du CGI"
      en: "VAT not applicable, article 293 B of the French General Tax Code (CGI)"
      de: "Keine Umsatzsteuer gemäß Art. 293 B CGI (französisches Steuergesetzbuch)"
    reverse_charge:
      fr: "Autoliquidation — article 196 de la directive 2006/112/CE"
      en: "Reverse charge — Article 196 of Directive 2006/112/EC"
      de: "Steuerschuldnerschaft des Leistungsempfängers — Art. 196 der Richtlinie 2006/112/EG"
    export:
      fr: "TVA non applicable, art. 259-1 du CGI"
      en: "VAT not applicable, article 259-1 of the French General Tax Code (CGI)"
      de: "Keine französische Umsatzsteuer gemäß Art. 259-1 CGI"
    b2b_late:
      fr: "En cas de retard de paiement : pénalités au taux de trois fois le taux d'intérêt légal et indemnité forfaitaire pour frais de recouvrement de 40 € (art. L441-10 du Code de commerce). Pas d'escompte pour paiement anticipé."
      en: "Late payment: penalties at three times the French statutory interest rate and a fixed recovery fee of €40 (art. L441-10 of the French Commercial Code). No discount for early payment."
      de: "Bei Zahlungsverzug: Verzugszinsen in Höhe des dreifachen gesetzlichen Zinssatzes und eine Pauschale von 40 € für Beitreibungskosten (Art. L441-10 Code de commerce). Kein Skonto bei vorzeitiger Zahlung."
  # Factur-X (PDF/A-3 + CII) profile EN16931, format of the French reform base (norme AFNOR XP Z12-012).
  # Almanach produces the file only: transmission goes through an approved platform (plateforme agréée).
  einvoice:
    formats:
      - { id: facturx, profile: EN16931, syntax: CII }
    default: facturx
    mandates:
      - scope: receive
        from: "2026-09-01"
        source: https://www.impots.gouv.fr/professionnel/je-decouvre-la-facturation-electronique
        verified_on: "2026-11-26"
      - scope: issue
        from: "2027-09-01"
        appliesTo: { statuses: [micro_bnc, micro_bic_services, micro_bic_sales] }
        source: https://www.impots.gouv.fr/professionnel/je-decouvre-la-facturation-electronique
        verified_on: "2026-11-26"
    # SIREN = first nine digits of the SIRET, ISO 6523 scheme 0002 (BT-30, BT-47).
    legalId: { identifier: siret, scheme: "0002", length: 9 }
    # CEF VATEX code list v9 (in force 2026-11-15), checked 2026-11-24.
    exemptionCodes: { franchise: VATEX-FR-FRANCHISE, reverse_charge: VATEX-EU-AE, export: VATEX-EU-O }
    note:
      fr: "Almanach produit la Factur-X mais ne la transmet pas, et ne reçoit pas les factures de vos fournisseurs : pour l'envoi comme pour la réception, utilisez la plateforme agréée de votre choix."
      en: "Almanach produces the Factur-X but neither transmits it nor receives your suppliers' invoices: for sending and receiving, use the approved platform (plateforme agréée) of your choice."
      de: "Almanach erstellt die Factur-X, übermittelt sie aber nicht und empfängt keine Lieferantenrechnungen: Nutzen Sie für Versand und Empfang die zugelassene Plattform (plateforme agréée) Ihrer Wahl."
