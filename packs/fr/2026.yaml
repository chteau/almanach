        de: "Berufsbildungsbeitrag (Handwerk)",
      }
    appliesTo: { statuses: [micro_bic_services, micro_bic_sales], options: [artisan] }
    base: revenue
    formula: { kind: flat, rates: [{ from: "2026-01-01", rateBp: 30 }] }
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23459
    verified_on: "2026-11-18"

  # Impôt sur le revenu au barème, sans versement libératoire : barème progressif par part (quotient familial),
  # plafonnement des demi-parts supplémentaires et décote. Le barème applicable aux revenus de 2026 sera fixé par la
  # loi de finances pour 2027, pas encore adoptée le 2026-11-24 : on applique le dernier barème publié (revenus 2025,
  # loi de finances pour 2026, F1419 « Vérifié le 12 novembre 2026 » ; brochure pratique IR 2026, calcul de l'impôt).
  # Base : chiffre d'affaires de cette micro-entreprise moins l'abattement de chaque activité. Les autres revenus du
  # foyer ne sont pas connus d'Almanach : l'estimation ne les compte pas. Parts et imposition commune : réglage de la
  # personne (une part par défaut). Non modélisés : plafond spécifique du parent isolé (4 262 €), réductions et
  # crédits d'impôt, contributions sur les hauts revenus, prélèvements sociaux.
  - id: income_tax_bareme
    label:
      {
        fr: "Impôt sur le revenu au barème (dernier barème publié)",
        en: "Income tax at the progressive scale (latest published scale)",
        de: "Einkommensteuer nach Tarif (zuletzt veröffentlichter Tarif)",
      }
    appliesTo: { withoutOptions: [versement_liberatoire] }
    base: taxable
    scope: person
    formula:
      kind: fr_income_tax
      bands:
        - { upToCents: 1160000, rateBp: 0 }
        - { upToCents: 2957900, rateBp: 1100 }
        - { upToCents: 8457700, rateBp: 3000 }
        - { upToCents: 18191700, rateBp: 4100 }
        - { upToCents: null, rateBp: 4500 }
      decote:
        single: { limitCents: 198200, baseCents: 89700, rateBp: 4525 }
        couple: { limitCents: 327700, baseCents: 148300, rateBp: 4525 }
      halfPartCapCents: 180700
    source: https://www.impots.gouv.fr/www2/fichiers/documentation/brochure/ir_2026/pdf_som/21-calcul_impot_369a382.pdf
    verified_on: "2026-11-24"

# Abattements forfaitaires du régime micro-fiscal (art. 50-0 et 102 ter du CGI), appliqués quand le versement
# libératoire n'est pas choisi. Activité mixte : l'abattement propre à chaque activité s'applique à la part de
# chiffre d'affaires correspondante, le minimum de 305 € par activité (610 € pour deux activités).
allowances:
  - id: allowance_bnc
    label:
      {
        fr: "Abattement forfaitaire (BNC, 34 %)",
        en: "Flat-rate allowance (BNC, 34 %)",
        de: "Pauschalabzug (BNC, 34 %)",
      }
    appliesTo: { statuses: [micro_bnc], withoutOptions: [versement_liberatoire] }
    rateBp: 3400
    minimumCents: 30500
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23267
    verified_on: "2026-11-24"
  - id: allowance_bic_services
    label:
      {
        fr: "Abattement forfaitaire (BIC services, 50 %)",
        en: "Flat-rate allowance (BIC services, 50 %)",
        de: "Pauschalabzug (BIC-Dienstleistungen, 50 %)",
      }
    appliesTo: { statuses: [micro_bic_services], withoutOptions: [versement_liberatoire] }
    rateBp: 5000
    minimumCents: 30500
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23267
    verified_on: "2026-11-24"
  - id: allowance_sales
    label:
      {
        fr: "Abattement forfaitaire (vente, 71 %)",
        en: "Flat-rate allowance (sales, 71 %)",
        de: "Pauschalabzug (Warenverkauf, 71 %)",
      }
    appliesTo: { statuses: [micro_bic_sales], withoutOptions: [versement_liberatoire] }
    rateBp: 7100
    minimumCents: 30500
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23267
    verified_on: "2026-11-24"

deadlines:
  - id: urssaf_monthly
    kind: social
    label:
      {
        fr: "Déclaration Urssaf du chiffre d'affaires",
        en: "Urssaf revenue declaration",
        de: "Urssaf-Umsatzmeldung",
      }
    description:
      fr: "Déclarer le chiffre d'affaires encaissé du mois et payer les cotisations (et le versement libératoire si vous l'avez choisi), même si le chiffre d'affaires est nul."
      en: "Declare the revenue collected during the month and pay contributions (and the flat-rate income tax if chosen), even when revenue is zero."
      de: "Den im Monat vereinnahmten Umsatz melden und die Beiträge zahlen (und ggf. die pauschale Einkommensteuer), auch bei null Umsatz."
    appliesTo: { periods: [monthly] }
    schedule:
      type: dates
      dates:
        - { due: "2026-02-28", periodStart: "2026-01-01", periodEnd: "2026-01-31" }
        - { due: "2026-03-31", periodStart: "2026-02-01", periodEnd: "2026-02-28" }
        - { due: "2026-04-30", periodStart: "2026-03-01", periodEnd: "2026-03-31" }
        - { due: "2026-05-31", periodStart: "2026-04-01", periodEnd: "2026-04-30" }
        - { due: "2026-06-30", periodStart: "2026-05-01", periodEnd: "2026-05-31" }
        - { due: "2026-07-31", periodStart: "2026-06-01", periodEnd: "2026-06-30" }
        - { due: "2026-08-31", periodStart: "2026-07-01", periodEnd: "2026-07-31" }
        - { due: "2026-09-30", periodStart: "2026-08-01", periodEnd: "2026-08-31" }
        # Urssaf : l'échéance du samedi 31 octobre 2026 n'est exceptionnellement pas reportée au 2 novembre.
        - { due: "2026-10-31", periodStart: "2026-09-01", periodEnd: "2026-09-30", fixed: true }
        - { due: "2026-11-30", periodStart: "2026-10-01", periodEnd: "2026-10-31" }
        - { due: "2026-12-31", periodStart: "2026-11-01", periodEnd: "2026-11-30" }
        - { due: "2027-01-31", periodStart: "2026-12-01", periodEnd: "2026-12-31" }
    estimates:
      [
        contributions_bnc,
        contributions_cipav,
        contributions_bic_services,
        contributions_sales,
        income_tax_bnc,
        income_tax_bic_services,
        income_tax_sales,
      ]
    declaresRevenue: true
    # Déclaration préparée : CA encaissé de la période, une ligne par activité (le CA est déclaré par catégorie
    # d'activité, chacune à son taux). Montant = cotisations (et versement libératoire) estimées de la période.
    prepare:
      basis: collected
      span: period
      lines:
        - id: ca_bnc
          label:
            {
              fr: "CA des prestations de services BNC",
              en: "BNC services revenue",
              de: "Umsatz BNC-Dienstleistungen",
            }
          measure: revenue
          statuses: [micro_bnc]
        - id: ca_bic_services
          label:
            {
              fr: "CA des prestations de services BIC",
              en: "BIC services revenue",
              de: "Umsatz BIC-Dienstleistungen",
            }
          measure: revenue
          statuses: [micro_bic_services]
        - id: ca_bic_sales
          label:
            { fr: "CA des ventes de marchandises", en: "Sales of goods revenue", de: "Umsatz Warenverkauf" }
          measure: revenue
          statuses: [micro_bic_sales]
      amount: { method: estimates }
      note:
        fr: "Montants encaissés, arrondis à l'euro sur le portail. Déclarez 0 si rien n'a été encaissé : la déclaration reste obligatoire."
        en: "Amounts collected, rounded to the euro on the portal. Declare 0 if nothing was collected: the declaration is still required."
        de: "Vereinnahmte Beträge, im Portal auf Euro gerundet. Bei null Einnahmen 0 melden: die Meldung bleibt Pflicht."
      source: https://entreprendre.service-public.gouv.fr/vosdroits/F23257
      verified_on: "2026-11-24"
    link: https://www.autoentrepreneur.urssaf.fr
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23257
    verified_on: "2026-11-18"
  - id: urssaf_quarterly
    kind: social
    label:
      {
        fr: "Déclaration Urssaf du chiffre d'affaires",
        en: "Urssaf revenue declaration",
        de: "Urssaf-Umsatzmeldung",
      }
    description:
      fr: "Déclarer le chiffre d'affaires encaissé du trimestre et payer les cotisations (et le versement libératoire si vous l'avez choisi), même si le chiffre d'affaires est nul."
      en: "Declare the revenue collected during the quarter and pay contributions (and the flat-rate income tax if chosen), even when revenue is zero."
      de: "Den im Quartal vereinnahmten Umsatz melden und die Beiträge zahlen (und ggf. die pauschale Einkommensteuer), auch bei null Umsatz."
    appliesTo: { periods: [quarterly] }
    schedule:
      type: dates
      dates:
        - { due: "2026-04-30", periodStart: "2026-01-01", periodEnd: "2026-03-31" }
        - { due: "2026-07-31", periodStart: "2026-04-01", periodEnd: "2026-06-30" }
        - { due: "2026-10-31", periodStart: "2026-07-01", periodEnd: "2026-09-30", fixed: true }
        - { due: "2027-01-31", periodStart: "2026-10-01", periodEnd: "2026-12-31" }
    estimates:
      [
        contributions_bnc,
        contributions_cipav,
        contributions_bic_services,
        contributions_sales,
        income_tax_bnc,
        income_tax_bic_services,
        income_tax_sales,
      ]
    declaresRevenue: true
    # Déclaration préparée : CA encaissé de la période, une ligne par activité (le CA est déclaré par catégorie
    # d'activité, chacune à son taux). Montant = cotisations (et versement libératoire) estimées de la période.
    prepare:
      basis: collected
      span: period
      lines:
        - id: ca_bnc
          label:
            {
              fr: "CA des prestations de services BNC",
              en: "BNC services revenue",
              de: "Umsatz BNC-Dienstleistungen",
            }
          measure: revenue
          statuses: [micro_bnc]
        - id: ca_bic_services
          label:
            {
              fr: "CA des prestations de services BIC",
              en: "BIC services revenue",
              de: "Umsatz BIC-Dienstleistungen",
            }
          measure: revenue
          statuses: [micro_bic_services]
        - id: ca_bic_sales
          label:
            { fr: "CA des ventes de marchandises", en: "Sales of goods revenue", de: "Umsatz Warenverkauf" }
          measure: revenue
          statuses: [micro_bic_sales]
      amount: { method: estimates }
      note:
        fr: "Montants encaissés, arrondis à l'euro sur le portail. Déclarez 0 si rien n'a été encaissé : la déclaration reste obligatoire."
        en: "Amounts collected, rounded to the euro on the portal. Declare 0 if nothing was collected: the declaration is still required."
        de: "Vereinnahmte Beträge, im Portal auf Euro gerundet. Bei null Einnahmen 0 melden: die Meldung bleibt Pflicht."
      source: https://entreprendre.service-public.gouv.fr/vosdroits/F23257
      verified_on: "2026-11-24"
    link: https://www.autoentrepreneur.urssaf.fr
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23257
    verified_on: "2026-11-18"
  - id: cfe
    kind: tax
    label:
      {
        fr: "Cotisation foncière des entreprises (CFE)",
        en: "Business property tax (CFE)",
        de: "Gewerbegrundsteuer (CFE)",
      }
    description:
      fr: "Paiement de la CFE sur votre espace professionnel impots.gouv.fr. Exonération l'année de création (déposer le formulaire 1447-C-SD avant le 31 décembre) et si le chiffre d'affaires de l'année N-2 ne dépasse pas 5 000 €."
      en: "Pay the CFE from your professional account on impots.gouv.fr. Exempt in the year of creation (file form 1447-C-SD by 31 December) and when revenue two years earlier did not exceed €5,000."
      de: "Zahlung der CFE im Unternehmenskonto auf impots.gouv.fr. Befreit im Gründungsjahr (Formular 1447-C-SD bis 31. Dezember) und wenn der Umsatz von vor zwei Jahren 5.000 € nicht überstieg."
    schedule: { type: dates, dates: [{ due: "2026-12-15" }] }
    link: https://www.impots.gouv.fr/professionnel
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23547
    verified_on: "2026-11-18"

# Réserve « à mettre de côté » : cotisations, versement libératoire ou impôt au barème, et CFP de l'année à date.
# Les déclarations Urssaf faites soldent les cotisations et le versement libératoire de leur période. La marge de
# 10 % est un choix du produit (prudence), pas une valeur légale ; la source est celle du calcul des cotisations.
reserve:
  include:
    [
      contributions_bnc,
      contributions_cipav,
      contributions_bic_services,
      contributions_sales,
      income_tax_bnc,
      income_tax_bic_services,
      income_tax_sales,
      cfp_liberal,
      cfp_commercial,
      cfp_artisan,
      income_tax_bareme,
    ]
  settles:
    - { deadline: urssaf_monthly, fiscalYear: period }
    - { deadline: urssaf_quarterly, fiscalYear: period }
  marginBp: 1000
  warning:
    fr: "Estimation indicative calculée sur le chiffre d'affaires encaissé (le régime micro ne déduit pas les dépenses réelles). L'impôt au barème utilise le dernier barème publié et ne compte que cette activité et vos parts ; les acomptes de prélèvement à la source déjà payés ne sont pas déduits. Ne remplace pas un avis de l'administration."
    en: "Indicative estimate based on revenue collected (the micro regime does not deduct actual expenses). Income tax uses the latest published scale and only counts this business and your parts; withholding instalments already paid are not deducted. Not an official notice."
    de: "Unverbindliche Schätzung auf Basis der vereinnahmten Umsätze (das Mikro-Regime zieht keine tatsächlichen Ausgaben ab). Die Einkommensteuer nutzt den zuletzt veröffentlichten Tarif und berücksichtigt nur diese Tätigkeit und Ihre Anteile; bereits gezahlte Quellensteuer-Vorauszahlungen werden nicht abgezogen. Kein Bescheid der Verwaltung."
  source: https://entreprendre.service-public.gouv.fr/vosdroits/F36232
  verified_on: "2026-11-24"
