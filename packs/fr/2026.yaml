deadlines:
  - id: urssaf_monthly
    kind: social
    label:
      {
        fr: "Déclaration Urssaf du chiffre d'affaires",
        en: "Urssaf revenue declaration",
        de: "Urssaf-Umsatzmeldung",
      }
    description:
      fr: "Déclarer le chiffre d'affaires encaissé du mois et payer les cotisations (et le versement libératoire si vous l'avez choisi), même si le chiffre d'affaires est nul."
      en: "Declare the revenue collected during the month and pay contributions (and the flat-rate income tax if chosen), even when revenue is zero."
      de: "Den im Monat vereinnahmten Umsatz melden und die Beiträge zahlen (und ggf. die pauschale Einkommensteuer), auch bei null Umsatz."
    appliesTo: { periods: [monthly] }
    schedule:
      type: dates
      dates:
        - { due: "2026-02-28", periodStart: "2026-01-01", periodEnd: "2026-01-31" }
        - { due: "2026-03-31", periodStart: "2026-02-01", periodEnd: "2026-02-28" }
        - { due: "2026-04-30", periodStart: "2026-03-01", periodEnd: "2026-03-31" }
        - { due: "2026-05-31", periodStart: "2026-04-01", periodEnd: "2026-04-30" }
        - { due: "2026-06-30", periodStart: "2026-05-01", periodEnd: "2026-05-31" }
        - { due: "2026-07-31", periodStart: "2026-06-01", periodEnd: "2026-06-30" }
        - { due: "2026-08-31", periodStart: "2026-07-01", periodEnd: "2026-07-31" }
        - { due: "2026-09-30", periodStart: "2026-08-01", periodEnd: "2026-08-31" }
        # Urssaf : l'échéance du samedi 31 octobre 2026 n'est exceptionnellement pas reportée au 2 novembre.
        - { due: "2026-10-31", periodStart: "2026-09-01", periodEnd: "2026-09-30", fixed: true }
        - { due: "2026-11-30", periodStart: "2026-10-01", periodEnd: "2026-10-31" }
        - { due: "2026-12-31", periodStart: "2026-11-01", periodEnd: "2026-11-30" }
        - { due: "2027-01-31", periodStart: "2026-12-01", periodEnd: "2026-12-31" }
    estimates:
      [
        contributions_bnc,
        contributions_cipav,
        contributions_bic_services,
        contributions_sales,
        income_tax_bnc,
        income_tax_bic_services,
        income_tax_sales,
      ]
    declaresRevenue: true
    link: https://www.autoentrepreneur.urssaf.fr
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23257
    verified_on: "2026-11-18"
  - id: urssaf_quarterly
    kind: social
    label:
      {
        fr: "Déclaration Urssaf du chiffre d'affaires",
        en: "Urssaf revenue declaration",
        de: "Urssaf-Umsatzmeldung",
      }
    description:
      fr: "Déclarer le chiffre d'affaires encaissé du trimestre et payer les cotisations (et le versement libératoire si vous l'avez choisi), même si le chiffre d'affaires est nul."
      en: "Declare the revenue collected during the quarter and pay contributions (and the flat-rate income tax if chosen), even when revenue is zero."
      de: "Den im Quartal vereinnahmten Umsatz melden und die Beiträge zahlen (und ggf. die pauschale Einkommensteuer), auch bei null Umsatz."
    appliesTo: { periods: [quarterly] }
    schedule:
      type: dates
      dates:
        - { due: "2026-04-30", periodStart: "2026-01-01", periodEnd: "2026-03-31" }
        - { due: "2026-07-31", periodStart: "2026-04-01", periodEnd: "2026-06-30" }
        - { due: "2026-10-31", periodStart: "2026-07-01", periodEnd: "2026-09-30", fixed: true }
        - { due: "2027-01-31", periodStart: "2026-10-01", periodEnd: "2026-12-31" }
    estimates:
      [
        contributions_bnc,
        contributions_cipav,
        contributions_bic_services,
        contributions_sales,
        income_tax_bnc,
        income_tax_bic_services,
        income_tax_sales,
      ]
    declaresRevenue: true
    link: https://www.autoentrepreneur.urssaf.fr
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23257
    verified_on: "2026-11-18"
  - id: cfe
    kind: tax
    label:
      {
        fr: "Cotisation foncière des entreprises (CFE)",
        en: "Business property tax (CFE)",
        de: "Gewerbegrundsteuer (CFE)",
      }
    description:
      fr: "Paiement de la CFE sur votre espace professionnel impots.gouv.fr. Exonération l'année de création (déposer le formulaire 1447-C-SD avant le 31 décembre) et si le chiffre d'affaires de l'année N-2 ne dépasse pas 5 000 €."
      en: "Pay the CFE from your professional account on impots.gouv.fr. Exempt in the year of creation (file form 1447-C-SD by 31 December) and when revenue two years earlier did not exceed €5,000."
      de: "Zahlung der CFE im Unternehmenskonto auf impots.gouv.fr. Befreit im Gründungsjahr (Formular 1447-C-SD bis 31. Dezember) und wenn der Umsatz von vor zwei Jahren 5.000 € nicht überstieg."
    schedule: { type: dates, dates: [{ due: "2026-12-15" }] }
    link: https://www.impots.gouv.fr/professionnel
    source: https://entreprendre.service-public.gouv.fr/vosdroits/F23547
    verified_on: "2026-11-18"
